<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cuestionario de Huella Ecológica (Responsive)</title>
  <style>
    :root{
      --bg:#0f172a;
      --panel:#111827;
      --card:#1f2937;
      --accent:#10b981;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --bad:#ef4444;
      --mid:#f59e0b;
      --good:#10b981;
      --glass: rgba(255,255,255,0.03);
      --gap: 0.75rem;
    }

    /* Reset básico */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,"Noto Sans",sans-serif;
      background:linear-gradient(180deg,#071028,#0f172a 60%);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.35;
      padding-bottom:3rem;
    }

    header{
      padding:1.25rem;
      text-align:center;
      background:linear-gradient(90deg,#071025,#0b1630);
      border-bottom:1px solid rgba(255,255,255,0.03);
      position:sticky;
      top:0;
      z-index:40;
      backdrop-filter: blur(6px);
    }
    header h1{margin:0;font-size:1.25rem}
    header p{margin:.35rem 0 0;color:var(--muted);font-size:.9rem}

    .container{
      max-width:960px;
      margin:1rem auto;
      padding:1rem;
      display:flex;
      flex-direction:column;
      gap:1rem;
    }

    .card{
      background:linear-gradient(180deg,var(--card),#17202b);
      border:1px solid rgba(255,255,255,0.03);
      border-radius:14px;
      padding:1rem;
      box-shadow:0 10px 30px rgba(2,6,23,0.6);
    }

    .card h2{
      margin:0 0 .75rem;
      font-size:1.05rem;
      display:flex;
      align-items:center;
      gap:.6rem;
    }

    .question{
      background:var(--glass);
      border-radius:10px;
      padding:.6rem;
      margin-bottom:.6rem;
      border:1px solid rgba(255,255,255,0.02);
    }
    .question label.qtext{
      display:block;
      font-weight:600;
      margin-bottom:.45rem;
      font-size:0.95rem;
    }

    /* Opciones: adaptativo automático */
    .options{
      display:grid;
      gap:.45rem;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    }

    .opt{
      display:flex;
      align-items:center;
      gap:.6rem;
      background:rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.02);
      padding:.55rem;
      border-radius:10px;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
      user-select:none;
    }
    .opt input[type="radio"]{
      width:20px;height:20px;
      accent-color:var(--accent);
    }
    .opt:hover{ transform:translateY(-3px); box-shadow:0 6px 20px rgba(2,6,23,0.6) }
    .opt span{font-weight:600;font-size:.95rem;color:var(--text)}

    /* Controls */
    .controls{
      display:flex;
      gap:.6rem;
      justify-content:flex-end;
      margin-top:.5rem;
      flex-wrap:wrap;
    }
    button{
      border:0;
      padding:.65rem .9rem;
      font-weight:700;
      border-radius:10px;
      cursor:pointer;
    }
    .primary{
      background:linear-gradient(90deg,#0ea5e9,#22d3ee);
      color:#04202a;
      box-shadow:0 8px 20px rgba(34,211,238,0.15);
    }
    .secondary{
      background:transparent;
      border:1px solid rgba(255,255,255,0.06);
      color:var(--text);
    }

    /* Resultado */
    #result{
      display:none;
      margin-top:.75rem;
      padding:1rem;
      border-radius:10px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.03);
    }
    #score{font-weight:800;font-size:1.15rem}
    #message{margin:.4rem 0 0}

    /* Barra de progreso */
    .progress-wrap{
      height:10px;
      background:rgba(255,255,255,0.03);
      border-radius:999px;
      overflow:hidden;
      margin-top:.5rem;
    }
    .progress{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,var(--good),var(--mid));
      transition:width .6s ease, background .3s ease;
    }

    /* Pequeños ajustes responsivos */
    @media (max-width:520px){
      header h1{font-size:1rem}
      .opt span{font-size:.9rem}
      .container{padding:.6rem}
      .card{padding:.85rem}
    }

    /* Para accesibilidad: mayor área táctil */
    input[type="radio"]{touch-action:manipulation}
  </style>
</head>

  <div class="card" style="display:flex;flex-direction:column;gap:.6rem;">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.6rem;">
      <div style="display:flex;flex-direction:column;gap:.4rem;max-width:70%;">
        <strong>Progreso</strong>
        <div class="progress-wrap" aria-hidden="true">
          <div class="progress" id="progressBar" style="width:0%"></div>
        </div>
      </div>

      <div style="display:flex;gap:.6rem;">
        <button class="secondary" onclick="reiniciar()" type="button">Reiniciar</button>
        <button class="primary" onclick="calcular()" type="button">Calcular resultado</button>
      </div>
    </div>

    <div id="result" aria-live="polite">
      <div id="score">Tu puntuación:</div>
      <div id="message"></div>
    </div>
  </div>
</main>

<script>
  // Constantes del cuestionario
  const QUESTIONS = 28;
  const MIN_SCORE = QUESTIONS * 1; // 28
  const MAX_SCORE = QUESTIONS * 4; // 112

  // Actualiza barra de progreso mientras el usuario responde
  function updateProgress(){
    let answered = 0;
    for(let i=1;i<=QUESTIONS;i++){
      if(document.querySelector(`input[name="q${i}"]:checked`)) answered++;
    }
    const pct = Math.round((answered / QUESTIONS) * 100);
    const bar = document.getElementById('progressBar');
    bar.style.width = pct + '%';
    // color gradient: green -> yellow -> red
    if(pct >= 80) bar.style.background = 'linear-gradient(90deg,var(--good),#7dd3a6)';
    else if(pct >= 50) bar.style.background = 'linear-gradient(90deg,var(--mid),#facc15)';
    else bar.style.background = 'linear-gradient(90deg,var(--bad),#fb7185)';
  }

  // Attach listener to all radios to update progress on change (delegation not needed)
  document.addEventListener('change', function(e){
    if(e.target && e.target.matches('input[type="radio"]')){
      updateProgress();
    }
  });

  // Calcular resultado
  function calcular(){
    let total = 0;
    for(let i=1;i<=QUESTIONS;i++){
      const sel = document.querySelector(`input[name="q${i}"]:checked`);
      if(!sel){
        // scroll to first unanswered question
        const qNode = document.querySelector(`input[name="q${i}"]`);
        if(qNode){
          qNode.scrollIntoView({behavior:'smooth',block:'center'});
        }
        alert('Por favor responde todas las preguntas antes de calcular.');
        return;
      }
      total += Number(sel.value);
    }

    // Mostrar resultado
    const result = document.getElementById('result');
    const scoreEl = document.getElementById('score');
    const msgEl = document.getElementById('message');

    scoreEl.textContent = `Tu puntuación: ${total} (mín ${MIN_SCORE} — máx ${MAX_SCORE})`;

    // Normalizar a porcentaje donde 0% = mejor (MIN_SCORE) y 100% = peor (MAX_SCORE)
    const normalized = (total - MIN_SCORE) / (MAX_SCORE - MIN_SCORE);
    const percent = Math.round(normalized * 100);

    let message = '';
    let bg = '';
    if(percent <= 30){
      message = '🌱 Impacto ecológico MUY bajo. ¡Excelente! Sigue así.';
      bg = 'linear-gradient(90deg,var(--good),#7dd3a6)';
    } else if(percent <= 60){
      message = '♻️ Impacto moderado. Hay hábitos que puedes mejorar.';
      bg = 'linear-gradient(90deg,var(--mid),#fbbf24)';
    } else {
      message = '🌍 Impacto alto. Te recomendamos revisar y cambiar algunos hábitos.';
      bg = 'linear-gradient(90deg,var(--bad),#fb7185)';
    }

    msgEl.textContent = `${message} (${percent}% en la escala de mejora)`;

    // actualiza barra de progreso final basado en percent (invertimos visual)
    const bar = document.getElementById('progressBar');
    // mostramos "completitud" de respuestas; también cambiamos color a según score
    bar.style.width = '100%';
    bar.style.background = bg;

    result.style.display = 'block';
    result.scrollIntoView({behavior:'smooth', block:'center'});
  }

  // Reiniciar formulario
  function reiniciar(){
    document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
    document.getElementById('result').style.display = 'none';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('progressBar').style.background = 'linear-gradient(90deg,var(--good),var(--mid))';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  // Inicializa el color
  document.getElementById('progressBar').style.background = 'linear-gradient(90deg,var(--good),var(--mid))';
</script>
</body>
</html>
